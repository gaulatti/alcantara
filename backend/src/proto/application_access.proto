syntax = "proto3";

package pompeii.access.v1;

// Pompeii's per-application access service (gaulatti/pompeii#51), as pinned by
// the screen contract of gaulatti/alcantara#224. Token ids are strings (the
// token's UUID); role, grant and user ids are integers.
service ApplicationAccessService {
  rpc ListMyTokens(AccessRequest) returns (TokenList);
  rpc CreateMyToken(CreateTokenRequest) returns (CreatedToken);
  rpc RevokeMyToken(RevokeTokenRequest) returns (Ack);
  rpc GetTokenSwitch(AccessRequest) returns (TokenSwitch);
  rpc SetTokenSwitch(SetTokenSwitchRequest) returns (TokenSwitch);
  rpc ListRoles(AccessRequest) returns (RoleList);
  rpc ListGrants(AccessRequest) returns (GrantList);
  rpc Grant(GrantRequest) returns (GrantRecord);
  rpc Revoke(RevokeGrantRequest) returns (Ack);
  rpc ListAccessHistory(HistoryRequest) returns (HistoryList);
}

message AccessRequest {
  // The person's Authorization header value, unchanged.
  string bearer_token = 1;
  int64 team_id = 2;
  // "console" | "mcp"
  string via_client = 3;
}

message Token {
  string id = 1;
  string name = 2;
  string display_prefix = 3;
  repeated string permissions = 4;
  string created_at = 5;
  // "" = no expiry
  string expires_at = 6;
  string last_used_at = 7;
  string created_via_application = 8;
  string last_used_application = 9;
}

message TokenList { repeated Token tokens = 1; }

message CreateTokenRequest {
  AccessRequest access = 1;
  string name = 2;
  int32 expires_in_days = 3;
  bool no_expiry = 4;
  repeated string permissions = 5;
  bool all_held_in_application = 6;
}

message CreatedToken {
  Token token = 1;
  // Returned here only, once.
  string value = 2;
}

message RevokeTokenRequest {
  AccessRequest access = 1;
  string token_id = 2;
}

message TokenSwitch { bool enabled = 1; }

message SetTokenSwitchRequest {
  AccessRequest access = 1;
  bool enabled = 2;
}

message Role {
  int64 id = 1;
  string name = 2;
  repeated string permissions = 3;
}

message RoleList { repeated Role roles = 1; }

message GrantRecord {
  int64 id = 1;
  int64 user_id = 2;
  string user_email = 3;
  int64 role_id = 4;
  string role_name = 5;
  int64 team_id = 6;
  string granted_at = 7;
}

message GrantList { repeated GrantRecord grants = 1; }

message GrantRequest {
  AccessRequest access = 1;
  int64 user_id = 2;
  int64 role_id = 3;
}

message RevokeGrantRequest {
  AccessRequest access = 1;
  int64 grant_id = 2;
}

message HistoryRequest {
  AccessRequest access = 1;
  // At most 200.
  int32 limit = 2;
  string before = 3;
}

message HistoryEntry {
  string at = 1;
  string action = 2;
  string actor_email = 3;
  string target = 4;
  string via_application = 5;
  string via_client = 6;
}

message HistoryList { repeated HistoryEntry entries = 1; }

message Ack {}
