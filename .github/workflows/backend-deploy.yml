name: Backend Deploy

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - 'deploy/**'
      - 'infra/**'
      - '.github/workflows/backend-deploy.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: alcantara_ci
          POSTGRES_USER: alcantara
          POSTGRES_PASSWORD: alcantara-ci-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U alcantara -d alcantara_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.DEPLOYMENT_TOKEN }}

      - name: Build Docker image
        run: |
          docker build \
            --build-arg ALCANTARA_BUILD_VERSION=${{ github.sha }} \
            -f backend/Dockerfile \
            -t ghcr.io/${{ github.repository }}:${{ github.sha }} \
            -t ghcr.io/${{ github.repository }}:latest \
            backend

      - name: Verify production migrations are non-interactive and repeatable
        run: |
          docker run --rm --network host \
            -e DATABASE_URL=postgresql://alcantara:alcantara-ci-password@127.0.0.1:5432/alcantara_ci \
            ghcr.io/${{ github.repository }}:latest \
            pnpm run db:migrate:deploy
          docker run --rm --network host \
            -e DATABASE_URL=postgresql://alcantara:alcantara-ci-password@127.0.0.1:5432/alcantara_ci \
            ghcr.io/${{ github.repository }}:latest \
            pnpm run db:migrate:deploy

      - name: Push Docker image to GHCR
        run: |
          docker push ghcr.io/${{ github.repository }}:${{ github.sha }}
          docker push ghcr.io/${{ github.repository }}:latest

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      id-token: write
    env:
      LIVEKIT_CONFIG_B64: ${{ secrets.LIVEKIT_CONFIG_B64 }}

    steps:
      - name: Checkout deployment definitions
        uses: actions/checkout@v4

      - name: Upload LiveKit deployment definition
        if: vars.ON_PREMISES == 'true' && env.LIVEKIT_CONFIG_B64 != ''
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          source: infra/compose.production.yml
          target: /home/${{ secrets.DEPLOY_USER }}/.alcantara
          strip_components: 1

      - name: Deploy to on-premises host
        if: vars.ON_PREMISES == 'true'
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            sh -c '
            set -eu
            docker network inspect broadcast-control >/dev/null
            docker login ghcr.io -u ${{ github.actor }} -p ${{ secrets.DEPLOYMENT_TOKEN }}
            docker pull ghcr.io/${{ github.repository }}:latest

            PALAZZO_TOKEN_SOURCE=""
            PALAZZO_CONTAINER_ID=""
            for container_id in $(docker ps -q --filter network=broadcast-control); do
              candidate=$(docker inspect "$container_id" --format "{{range .Mounts}}{{if eq .Destination \"/run/secrets/palazzo-control-token\"}}{{.Source}}{{end}}{{end}}")
              if test -z "$candidate"; then
                continue
              fi
              if test -n "$PALAZZO_TOKEN_SOURCE" && test "$PALAZZO_TOKEN_SOURCE" != "$candidate"; then
                echo "Multiple Palazzo control-token mounts found; refusing replacement"
                exit 1
              fi
              PALAZZO_TOKEN_SOURCE="$candidate"
              PALAZZO_CONTAINER_ID="$container_id"
            done
            if test -z "$PALAZZO_TOKEN_SOURCE"; then
              echo "Palazzo control-token mount not found; refusing replacement"
              exit 1
            fi

            # Resolve and validate the new runtime before touching the live
            # backend. This entrypoint does not construct Nest or send any
            # Palazzo playback commands.
            docker run --rm \
            -e NODE_ENV=production \
            -e AWS_REGION="${{ vars.AWS_REGION }}" \
            -e ALCANTARA_CONFIG_SECRET_ID="${{ vars.ALCANTARA_CONFIG_SECRET_ID }}" \
            -e PALAZZO_CONTROL_TOKEN_FILE=/run/secrets/palazzo-control-token \
            -e PALAZZO_ALLOWED_URLS=http://palazzo:3100 \
            --volumes-from "$PALAZZO_CONTAINER_ID:ro" \
            -v "$HOME/.aws:/root/.aws:ro" \
            ghcr.io/${{ github.repository }}:latest \
            pnpm run preflight:runtime

            docker run --rm \
            -e DATABASE_URL="${{ secrets.DATABASE_URL }}" \
            ghcr.io/${{ github.repository }}:latest \
            pnpm run db:migrate:deploy

            if test -n "${{ secrets.LIVEKIT_CONFIG_B64 }}"; then
              mkdir -p "$HOME/.alcantara/livekit-redis"
              printf "%s" "${{ secrets.LIVEKIT_CONFIG_B64 }}" | base64 --decode > "$HOME/.alcantara/livekit.yaml"
              chmod 600 "$HOME/.alcantara/livekit.yaml"
              ALCANTARA_SERVICE_DIR="$HOME/.alcantara" docker compose -f "$HOME/.alcantara/compose.production.yml" up -d
            else
              echo "LiveKit production configuration is absent; guest calls remain disabled"
            fi

            had_previous=0
            docker rm -f alcantara-backend-previous >/dev/null 2>&1 || true
            if docker inspect alcantara-backend >/dev/null 2>&1; then
              docker stop alcantara-backend
              docker rename alcantara-backend alcantara-backend-previous
              had_previous=1
            fi

            rollback_backend() {
              echo "Restoring previous Alcantara backend"
              docker rm -f alcantara-backend >/dev/null 2>&1 || true
              if test "$had_previous" -eq 1; then
                docker rename alcantara-backend-previous alcantara-backend
                docker start alcantara-backend
                for rollback_attempt in $(seq 1 30); do
                  if docker exec alcantara-backend node -e "const socket=require(\"node:net\").connect(${{ vars.HTTP_PORT }},\"127.0.0.1\",()=>{socket.end();process.exit(0)});socket.setTimeout(1000,()=>{socket.destroy();process.exit(1)});socket.on(\"error\",()=>process.exit(1))"; then
                    echo "Previous Alcantara backend restored"
                    return 0
                  fi
                  sleep 2
                done
                echo "Previous Alcantara backend did not recover"
              fi
              return 1
            }

            LOG_STREAM_UUID=$(uuidgen)

            if ! docker run -d --name alcantara-backend \
            --network broadcast-control \
            -p ${{ vars.HTTP_PORT }}:${{ vars.HTTP_PORT }} \
            -e NODE_ENV=production \
            -e HTTP_PORT="${{ vars.HTTP_PORT }}" \
            -e PORT="${{ vars.HTTP_PORT }}" \
            -e ALCANTARA_BUILD_VERSION="${{ github.sha }}" \
            -e METRICS_TOKEN_FILE=/run/secrets/alcantara-metrics-token \
            -e DATABASE_URL="${{ secrets.DATABASE_URL }}" \
            -e ALLOWED_ORIGINS="${{ vars.FQDN }}" \
            -e AWS_REGION="${{ vars.AWS_REGION }}" \
            -e ALCANTARA_CONFIG_SECRET_ID="${{ vars.ALCANTARA_CONFIG_SECRET_ID }}" \
            -e PALAZZO_CONTROL_TOKEN_FILE=/run/secrets/palazzo-control-token \
            -e PALAZZO_ALLOWED_URLS=http://palazzo:3100 \
            -e POMPEII_TEAM_ID=1 \
            -e MEDIA_S3_BUCKET="${{ secrets.MEDIA_S3_BUCKET }}" \
            -e LIVEKIT_WS_URL="${{ vars.LIVEKIT_WS_URL }}" \
            -e LIVEKIT_API_URL="http://alcantara-livekit:7880" \
            -e LIVEKIT_API_KEY="${{ secrets.LIVEKIT_API_KEY }}" \
            -e LIVEKIT_API_SECRET="${{ secrets.LIVEKIT_API_SECRET }}" \
            -e WEBRTC_SESSION_SECRET="${{ secrets.WEBRTC_SESSION_SECRET }}" \
            -e WEBRTC_RENDERER_KEY="${{ secrets.WEBRTC_RENDERER_KEY }}" \
            -e CONTAINERIZED=true \
            --restart=always \
            --log-driver=awslogs \
            --log-opt awslogs-region=${{ vars.AWS_REGION }} \
            --log-opt awslogs-group=${{ vars.LOGS_GROUP }} \
            --log-opt awslogs-stream="$LOG_STREAM_UUID" \
            -v ~/.aws:/root/.aws:ro \
            --volumes-from "$PALAZZO_CONTAINER_ID:ro" \
            ghcr.io/${{ github.repository }}:latest; then
              echo "Replacement Alcantara backend could not be created"
              rollback_backend || true
              exit 1
            fi

            for attempt in $(seq 1 45); do
              if docker exec alcantara-backend node -e "const socket=require(\"node:net\").connect(${{ vars.HTTP_PORT }},\"127.0.0.1\",()=>{socket.end();process.exit(0)});socket.setTimeout(1000,()=>{socket.destroy();process.exit(1)});socket.on(\"error\",()=>process.exit(1))"; then
                echo "Alcantara backend startup check passed"
                if test "$had_previous" -eq 1; then
                  docker rm alcantara-backend-previous
                fi
                exit 0
              fi
              sleep 2
            done

            echo "Alcantara backend failed to start"
            docker logs --tail 200 alcantara-backend || true
            rollback_backend || true
            exit 1
            '

      - name: Configure AWS credentials
        if: vars.ON_PREMISES != 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: us-east-1
          role-to-assume: arn:aws:iam::792025092931:role/alcantara-github-deploy

      - name: Deploy to Cumulus through SSM
        if: vars.ON_PREMISES != 'true'
        env:
          DEPLOYMENT_TOKEN: ${{ secrets.DEPLOYMENT_TOKEN }}
        run: |
          set -euo pipefail
          INSTANCE_IDS="$(aws ec2 describe-instances \
            --filters Name=tag:Name,Values=macondo-services Name=instance-state-name,Values=running \
            --query 'Reservations[].Instances[].InstanceId' \
            --output json)"
          if [ "$(jq 'length' <<<"$INSTANCE_IDS")" -ne 1 ]; then
            echo 'Expected exactly one running Macondo service host'
            exit 1
          fi
          CUMULUS_INSTANCE_ID="$(jq -r '.[0]' <<<"$INSTANCE_IDS")"

          BROADCAST_SECRET_ID='broadcast/production/config'
          DATABASE_SECRET_ID='${{ vars.ARAUCO_SECRET_ARN }}'
          MEDIA_BUCKET='${{ vars.MEDIA_S3_BUCKET }}'
          for value in "$DATABASE_SECRET_ID" "$MEDIA_BUCKET"; do
            test -n "$value"
            test "$value" != None
          done

          SCRIPT_BASE64="$(base64 -w 0 deploy/cumulus.sh)"
          NGINX_BASE64="$(base64 -w 0 deploy/cumulus.nginx.conf)"
          TOKEN_BASE64="$(printf '%s' "$DEPLOYMENT_TOKEN" | base64 -w 0)"
          REMOTE_COMMAND="$(jq -nr \
            --arg script "$SCRIPT_BASE64" \
            --arg user "$GITHUB_ACTOR" \
            --arg token "$TOKEN_BASE64" \
            --arg broadcastSecret "$BROADCAST_SECRET_ID" \
            --arg databaseSecret "$DATABASE_SECRET_ID" \
            --arg image "ghcr.io/${GITHUB_REPOSITORY}:${GITHUB_SHA}" \
            --arg nginx "$NGINX_BASE64" \
            --arg mediaBucket "$MEDIA_BUCKET" \
            '[
              "printf %s " + ($script | @sh) + " | base64 -d > /tmp/deploy-alcantara.sh",
              "chmod 0700 /tmp/deploy-alcantara.sh",
              "deployment_status=0; /tmp/deploy-alcantara.sh " + ([$user, $token, $broadcastSecret, $databaseSecret, $image, $nginx, $mediaBucket] | map(@sh) | join(" ")) + " || deployment_status=$?; rm -f /tmp/deploy-alcantara.sh; exit $deployment_status"
            ] | join("\n")')"
          PARAMETERS="$(jq -cn --arg command "$REMOTE_COMMAND" '{commands:[$command],executionTimeout:["900"]}')"
          COMMAND_ID="$(aws ssm send-command \
            --instance-ids "$CUMULUS_INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment 'Deploy Alcantara to Cumulus' \
            --parameters "$PARAMETERS" \
            --query 'Command.CommandId' \
            --output text)"

          for _ in $(seq 1 180); do
            if ! COMMAND_STATUS="$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$CUMULUS_INSTANCE_ID" \
              --query Status \
              --output text 2>&1)"; then
              case "$COMMAND_STATUS" in
                *InvocationDoesNotExist*)
                  sleep 5
                  continue
                  ;;
                *)
                  printf '%s\n' "$COMMAND_STATUS" >&2
                  exit 1
                  ;;
              esac
            fi
            case "$COMMAND_STATUS" in
              Success)
                aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" \
                  --instance-id "$CUMULUS_INSTANCE_ID" \
                  --query StandardOutputContent \
                  --output text
                exit 0
                ;;
              Failed|Cancelled|TimedOut)
                aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" \
                  --instance-id "$CUMULUS_INSTANCE_ID" \
                  --query '{Output:StandardOutputContent,Error:StandardErrorContent}' \
                  --output json
                exit 1
                ;;
            esac
            sleep 5
          done
          echo 'Timed out waiting for Alcantara deployment'
          exit 1
