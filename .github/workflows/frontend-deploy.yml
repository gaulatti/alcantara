name: Frontend Deploy

on:
  push:
    branches:
      - main
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-deploy.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.5

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4.0.2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Install dependencies
        run: |
          npm ci

      - name: Typecheck frontend
        run: npm run typecheck

      - name: Test frontend
        run: npm test

      - name: Build frontend
        env:
          VITE_FQDN: ${{ vars.FQDN }}
          VITE_API_BASE_URL: ${{ vars.API_BASE_URL }}
          VITE_COGNITO_USER_POOL_ID: ${{ vars.COGNITO_USER_POOL_ID }}
          VITE_COGNITO_CLIENT_ID: ${{ vars.COGNITO_CLIENT_ID }}
          VITE_COGNITO_DOMAIN: ${{ vars.COGNITO_DOMAIN }}
        run: |
          npm run build

      - name: Upload frontend artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: frontend/build/client/
          if-no-files-found: error

  deploy:
    runs-on: ubuntu-latest
    needs: build

    steps:
      # First, because checkout cleans the workspace: only the prune script is needed here.
      - name: Check out the prune script
        uses: actions/checkout@v4
        with:
          sparse-checkout: scripts/prune-old-assets.sh
          sparse-checkout-cone-mode: false

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4.0.2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Download frontend artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-build
          path: frontend-dist

      - name: Upload to S3
        run: |
          # The site stays complete at every moment (gaulatti/alcantara#228).
          # New hashed assets first: nothing references them yet.
          aws s3 sync frontend-dist/assets/ s3://${{ vars.BUCKET_NAME }}/assets/ \
            --cache-control "public,max-age=31536000,immutable"
          # Everything else except the entry page.
          aws s3 sync frontend-dist/ s3://${{ vars.BUCKET_NAME }} \
            --exclude "assets/*" \
            --exclude "index.html" \
            --cache-control "public,max-age=300"
          # The entry page last: this is the switch to the new build.
          aws s3 cp frontend-dist/index.html s3://${{ vars.BUCKET_NAME }}/index.html \
            --content-type "text/html; charset=utf-8" \
            --cache-control "no-cache,no-store,must-revalidate"
          # Remove files the new build no longer has, outside assets/. Old
          # hashed assets stay so a console already open keeps loading its chunks.
          aws s3 sync frontend-dist/ s3://${{ vars.BUCKET_NAME }} \
            --exclude "assets/*" --exclude "index.html" --delete --size-only \
            --cache-control "public,max-age=300"

      - name: Prune old hashed assets
        # Best effort: a failure here never fails the deploy (gaulatti/alcantara#229).
        continue-on-error: true
        run: |
          # Delete assets/ objects that are not in this build and are older than 14 days. Old files
          # younger than that stay so a console already open keeps loading its chunks.
          bash scripts/prune-old-assets.sh "${{ vars.BUCKET_NAME }}" frontend-dist 14

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation --distribution-id ${{ vars.DISTRIBUTION_ID }} --paths "/*"
