# The on-air contribution worker on cumulus (gaulatti/alcantara calls): the station's one producer for Palazzo's live
# input. It listens to the program's call room and pushes the guests cued live and the host's `onair:host` track to
# Palazzo over the broadcast-control network, only while someone is on air. Nothing is published on the host, and a
# memory cap keeps it from ever starving Palazzo: if it dies, Palazzo loses only the live input, and music and filler
# carry on. infra/cumulus/contribution-up.sh writes contribution.env and starts it.
name: alcantara-contribution

services:
  contribution:
    build:
      context: ./contribution
    image: alcantara-contribution:local
    container_name: alcantara-contribution
    # The renderer key, the API origin, the program id and Palazzo's RTMP address, in a 0600 file the deploy writes.
    env_file:
      - ${ALCANTARA_SERVICE_DIR:-/services/alcantara}/contribution.env
    init: true
    cpus: 0.5
    mem_limit: 256m
    memswap_limit: 256m
    restart: always
    networks:
      - broadcast-control
    logging:
      driver: local
      options:
        max-size: '10m'
        max-file: '3'
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:8091/').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

networks:
  broadcast-control:
    external: true
