name: alcantara-media

services:
  redis:
    image: redis:7.4-alpine
    container_name: alcantara-livekit-redis
    command: ['redis-server', '--save', '60', '1', '--appendonly', 'yes']
    volumes:
      - ${ALCANTARA_SERVICE_DIR:-/services/alcantara}/livekit-redis:/data
    restart: always
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20

  livekit:
    image: livekit/livekit-server:v1.13.4
    container_name: alcantara-livekit
    command: ['--config', '/etc/livekit.yaml']
    volumes:
      - ${ALCANTARA_SERVICE_DIR:-/services/alcantara}/livekit.yaml:/etc/livekit.yaml:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    ports:
      # Signalling stays on the host: nginx terminates TLS for the public name
      # and proxies WebSocket upgrades here. The backend reaches it on the network.
      - '127.0.0.1:7880:7880/tcp'
      - '7881:7881/tcp'
      - '3478:3478/udp'
      - '5349:5349/tcp'
      - '30000-30100:30000-30100/udp'
      - '50000-50100:50000-50100/udp'
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '-q', '-T', '2', '-O', '/dev/null', 'http://127.0.0.1:7880/']
      interval: 5s
      timeout: 3s
      retries: 20
    # The host also runs the radio engine: LiveKit gets at most one CPU and 1 GiB.
    cpus: 1.0
    mem_limit: 1g
    restart: always

  ingress:
    image: livekit/ingress:v1.5.0
    container_name: alcantara-livekit-ingress
    # Off by default: WHIP/HLS ingress needs its own ingress.yaml, which the
    # deploy does not write yet. Start it with `--profile ingress` once it does.
    profiles: ['ingress']
    environment:
      INGRESS_CONFIG_FILE: /etc/ingress.yaml
    volumes:
      - ${ALCANTARA_SERVICE_DIR:-/services/alcantara}/ingress.yaml:/etc/ingress.yaml:ro
    ports:
      - '8080:8080/tcp'
      - '7885:7885/udp'
      - '127.0.0.1:8081:8081/tcp'
      - '127.0.0.1:8082:8082/tcp'
    depends_on:
      livekit:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: always

networks:
  default:
    external: true
    name: broadcast-control
