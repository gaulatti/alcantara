# The shape infra/helix/livekit-up.sh renders from the runtime secret
# (backend/src/config/livekit-server-config.js). Never commit real values.
port: 7880
rtc:
  tcp_port: 7881
  udp_port: 7882
  use_external_ip: true
redis:
  address: redis:6379
turn:
  enabled: true
  domain: turn.example.invalid
  # Only when the secret has livekitTurnTlsDomain: nginx ends TLS on 443 and sends the plain stream to tls_port.
  tls_port: 5349
  external_tls: true
  udp_port: 3478
  relay_range_start: 30000
  relay_range_end: 30100
  ttl_seconds: 300
keys:
  replace-api-key: replace-api-secret
