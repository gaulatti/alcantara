# gaulatti/alcantara#354: the public name for LiveKit on Helix.
# Installed as /etc/nginx/sites-available/livekit-alcantara (nginx loads every
# file there). This is the port-80 half only: `certbot --nginx -d
# livekit.alcantara.gaulatti.com` adds the 443 listener, the certificate and the
# redirect, like the other sites on the host.
server {
    server_name livekit.alcantara.gaulatti.com;
    listen 80;
    listen [::]:80;

    location / {
        proxy_pass http://127.0.0.1:7880;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # A call's signalling WebSocket stays open for the whole call.
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
}
