# gaulatti/alcantara#354: LiveKit for production runs on Helix, the on-premises
# host behind helix.gaulatti.com. infra/helix/livekit-up.sh renders livekit.yaml
# and starts this project as `alcantara-livekit`; the backend workflow does not.
name: alcantara-livekit

services:
  redis:
    image: redis:7.4-alpine
    container_name: alcantara-livekit-redis
    command: ['redis-server', '--save', '60', '1', '--appendonly', 'yes']
    volumes:
      - ${ALCANTARA_SERVICE_DIR:-/services/alcantara}/livekit-redis:/data
    # Never published: LiveKit reaches it as redis:6379 on this project's network.
    cpus: 0.5
    mem_limit: 512m
    restart: always
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20

  livekit:
    image: livekit/livekit-server:v1.13.4
    container_name: alcantara-livekit
    command: ['--config', '/etc/livekit.yaml']
    volumes:
      - ${ALCANTARA_SERVICE_DIR:-/services/alcantara}/livekit.yaml:/etc/livekit.yaml:ro
    ports:
      # Signalling stays on the host: nginx terminates TLS for
      # livekit.alcantara.gaulatti.com and proxies here, for browsers, the pilot
      # and the backend's API calls alike.
      - '127.0.0.1:7880:7880/tcp'
      # The three ports the router forwards: WebRTC over TCP, the single muxed
      # WebRTC UDP port, and the built-in TURN. The TURN relay range only carries
      # traffic from TURN to the SFU inside this container, so it is not published.
      - '7881:7881/tcp'
      - '7882:7882/udp'
      - '3478:3478/udp'
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '-q', '-T', '2', '-O', '/dev/null', 'http://127.0.0.1:7880/']
      interval: 5s
      timeout: 3s
      retries: 20
    # Helix also runs other services: LiveKit gets at most one CPU and 1 GiB.
    cpus: 1.0
    mem_limit: 1g
    restart: always

  ingress:
    image: livekit/ingress:v1.5.0
    container_name: alcantara-livekit-ingress
    # Off by default: WHIP/HLS ingress needs its own ingress.yaml, which the
    # deploy does not write yet. Start it with `--profile ingress` once it does.
    profiles: ['ingress']
    environment:
      INGRESS_CONFIG_FILE: /etc/ingress.yaml
    volumes:
      - ${ALCANTARA_SERVICE_DIR:-/services/alcantara}/ingress.yaml:/etc/ingress.yaml:ro
    ports:
      - '8080:8080/tcp'
      - '7885:7885/udp'
      - '127.0.0.1:8081:8081/tcp'
      - '127.0.0.1:8082:8082/tcp'
    depends_on:
      livekit:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: always
