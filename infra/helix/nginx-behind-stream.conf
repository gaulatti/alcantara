# Goes in the http context (e.g. /etc/nginx/conf.d/behind-stream.conf) once HTTPS sites listen on 127.0.0.1:8443:
# the client's address comes from the stream block's PROXY header, and redirects must not name port 8443.
set_real_ip_from 127.0.0.1;
real_ip_header proxy_protocol;
port_in_redirect off;
