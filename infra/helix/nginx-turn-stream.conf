# TURN over TLS on 443 (gaulatti/alcantara#354): guests whose networks block UDP and TCP 7881 still connect.
#
# This is a MAIN-context file, not a site: nginx.conf needs `include /etc/nginx/stream.d/*.conf;` outside `http {}`
# (Fedora also needs the `nginx-mod-stream` package). It takes port 443 for the whole host, so every HTTPS server
# block must first move to 127.0.0.1:8443 (infra/README.md, "TURN over TLS"). If a `stream {}` block already exists,
# merge these into it.
stream {
    # The name a client asks for decides where its connection goes; every other name is a web site.
    map $ssl_preread_server_name $alcantara_443 {
        turn.alcantara.gaulatti.com 127.0.0.1:5350;
        default                     127.0.0.1:8443;
    }

    server {
        listen 443;
        listen [::]:443;
        ssl_preread on;
        proxy_pass $alcantara_443;
        # Carries the client's address on to both, since it no longer reaches them directly.
        proxy_protocol on;
        proxy_connect_timeout 5s;
        # A call stays connected for hours.
        proxy_timeout 24h;
    }

    # Ends TLS for TURN and passes LiveKit the plain stream (turn.external_tls).
    server {
        listen 127.0.0.1:5350 ssl proxy_protocol;
        ssl_certificate     /etc/letsencrypt/live/turn.alcantara.gaulatti.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/turn.alcantara.gaulatti.com/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        proxy_pass 127.0.0.1:5349;
        proxy_timeout 24h;
    }
}
