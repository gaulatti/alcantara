name: alcantara

services:
  livekit:
    image: livekit/livekit-server:v1.13.4
    command: ['--config', '/etc/livekit.yaml', '--bind', '0.0.0.0']
    volumes:
      - ./infra/livekit.dev.yaml:/etc/livekit.yaml:ro
    ports:
      - '7880:7880'
      - '7881:7881'
      - '7882:7882/udp'
    healthcheck:
      test: ['CMD-SHELL', 'wget -q -O /dev/null http://localhost:7880 || exit 1']
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
      args:
        ALCANTARA_BUILD_VERSION: ${ALCANTARA_BUILD_VERSION:-dev}
    ports:
      - "${BACKEND_PORT:-3000}:${BACKEND_PORT:-3000}"
    env_file: ./backend/.env
    environment:
      PORT: ${BACKEND_PORT:-3000}
      ALLOWED_ORIGINS: http://localhost:${VITE_PORT:-5173}
      CHOKIDAR_USEPOLLING: 'true'
      LIVEKIT_WS_URL: ws://localhost:7880
      LIVEKIT_API_URL: http://livekit:7880
      LIVEKIT_API_KEY: devkey
      LIVEKIT_API_SECRET: devsecret-devsecret-devsecret-devsecret
      WEBRTC_SESSION_SECRET: alcantara-local-session-secret-change-me-now
      WEBRTC_RENDERER_KEY: alcantara-local-renderer-secret-change-me-now
      METRICS_TOKEN_FILE: /run/secrets/alcantara-metrics-token
      PALAZZO_CONTROL_TOKEN: palazzo-local-control-token
      PALAZZO_ALLOWED_URLS: http://palazzo:3100
    volumes:
      - ./backend/src:/app/src
      - ./backend/prisma:/app/prisma
      - ./backend/tsconfig.json:/app/tsconfig.json
      - ./backend/nest-cli.json:/app/nest-cli.json
      - ~/.aws:/root/.aws:ro
    develop:
      watch:
        - action: sync
          path: ./backend/src
          target: /app/src
          ignore:
            - node_modules/
        - action: sync
          path: ./backend/prisma
          target: /app/prisma
        - action: rebuild
          path: ./backend/package.json
    restart: unless-stopped
    depends_on:
      livekit:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    ports:
      - "${VITE_PORT:-5173}:${VITE_PORT:-5173}"
    env_file: ./frontend/.env
    environment:
      - VITE_PORT=${VITE_PORT:-5173}
      - VITE_USE_POLLING=true
    volumes:
      - ./frontend/app:/app/app
      - ./frontend/vite.config.ts:/app/vite.config.ts
      - ./frontend/react-router.config.ts:/app/react-router.config.ts
      - ./frontend/tsconfig.json:/app/tsconfig.json
    develop:
      watch:
        - action: sync
          path: ./frontend/app
          target: /app/app
          ignore:
            - node_modules/
        - action: rebuild
          path: ./frontend/package.json
    command: sh -c "npm run dev"
    restart: unless-stopped
