name: alcantara

services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: alcantara
      POSTGRES_USER: alcantara
      POSTGRES_PASSWORD: alcantara-local-development
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s
    restart: unless-stopped

  # Local media store (gaulatti/alcantara#206). The backend's S3 traffic must
  # never reach a real bucket from a local run.
  localstack:
    image: localstack/localstack:4.0.3
    environment:
      SERVICES: s3
      AWS_DEFAULT_REGION: us-east-1
    ports:
      - "${LOCALSTACK_PORT:-4566}:4566"
    volumes:
      - ./infra/localstack-init:/etc/localstack/init/ready.d:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "awslocal s3api get-bucket-policy --bucket alcantara-local-only >/dev/null 2>&1",
        ]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

  livekit:
    image: livekit/livekit-server:v1.13.4
    command: ["--config", "/etc/livekit.yaml", "--bind", "0.0.0.0"]
    volumes:
      - ./infra/livekit.dev.yaml:/etc/livekit.yaml:ro
    ports:
      - "7880:7880"
      - "7881:7881"
      - "7882:7882/udp"
    healthcheck:
      test:
        ["CMD-SHELL", "wget -q -O /dev/null http://localhost:7880 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
  alana-recording-fixture:
    build:
      context: .
      dockerfile: backend/Dockerfile.dev
    command: ["node", "test/fixtures/alana-recording-server.mjs"]
    environment:
      PORT: "8080"
      PROGRAM_ID: modoitaliano
      DESTINATION_PROGRAM_ID: main
      ALANA_CONTROL_TOKEN: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:8080/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile.dev
      args:
        ALCANTARA_BUILD_VERSION: ${ALCANTARA_BUILD_VERSION:-dev}
    ports:
      - "${BACKEND_PORT:-3000}:${BACKEND_PORT:-3000}"
    command:
      ["sh", "-c", "pnpm db:migrate:prisma && pnpm seed && pnpm start:dev"]
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://alcantara:alcantara-local-development@postgres:5432/alcantara?schema=public
      AUTH_MODE: test
      TEST_AUTH_SECRET: alcantara-local-browser-test-secret-change-me
      POMPEII_TEAM_ID: "1"
      PORT: ${BACKEND_PORT:-3000}
      ALLOWED_ORIGINS: http://localhost:${VITE_PORT:-5173}
      CHOKIDAR_USEPOLLING: "true"
      # nest start --watch uses TypeScript's watcher, which CHOKIDAR_USEPOLLING does not reach. On
      # Colima a host edit arrives through the bind mount without a file event, so the watcher polls
      # here (gaulatti/alcantara#600). Local Compose only: the production image never sets these.
      TSC_WATCHFILE: DynamicPriorityPolling
      TSC_WATCHDIRECTORY: RecursiveDirectoryUsingDynamicPriorityPolling
      LIVEKIT_WS_URL: ws://localhost:7880
      LIVEKIT_API_URL: http://livekit:7880
      LIVEKIT_API_KEY: devkey
      LIVEKIT_API_SECRET: devsecret-devsecret-devsecret-devsecret
      WEBRTC_SESSION_SECRET: alcantara-local-session-secret-change-me-now
      WEBRTC_RENDERER_KEY: alcantara-local-renderer-secret-change-me-now
      METRICS_TOKEN_FILE: /run/secrets/alcantara-metrics-token
      PALAZZO_ALLOWED_URLS: http://palazzo:3100
      ALANA_CONTROL_TOKEN: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
      ALANA_CONTROL_URL: http://alana-recording-fixture:8080
      EXTERNAL_SOURCE_CONFIG_CURRENT_VERSION: "1"
      EXTERNAL_SOURCE_CONFIG_KEYS: '{"1":"YWxjYW50YXJhLWxvY2FsLXNvdXJjZS1rZXktMDAwMDA="}'
      EXTERNAL_SOURCE_TEAM_QUOTA: "16"
      # These override anything backend/.env holds (gaulatti/alcantara#206):
      # the media bucket is the local one, AWS credentials are local
      # placeholders, and no AWS profile, session, role or Secrets Manager
      # secret from the host reaches the container.
      MEDIA_S3_BUCKET: alcantara-local-only
      AWS_REGION: us-east-1
      AWS_DEFAULT_REGION: us-east-1
      AWS_ACCESS_KEY_ID: local-only-access-key
      AWS_SECRET_ACCESS_KEY: local-only-secret-key
      AWS_SESSION_TOKEN: ""
      AWS_PROFILE: ""
      AWS_CONFIG_FILE: ""
      AWS_SHARED_CREDENTIALS_FILE: ""
      AWS_ROLE_ARN: ""
      AWS_WEB_IDENTITY_TOKEN_FILE: ""
      AWS_CONTAINER_CREDENTIALS_FULL_URI: ""
      AWS_CONTAINER_CREDENTIALS_RELATIVE_URI: ""
      ARAUCO_SECRET_ID: ""
      # The local store's S3 endpoint and the base its objects are served
      # from; both are refused in production.
      MEDIA_S3_ENDPOINT: http://localstack:4566
      LOCAL_MEDIA_PUBLIC_BASE_URL: http://localstack.localhost:${LOCALSTACK_PORT:-4566}/alcantara-local-only
    extra_hosts:
      # The public media base resolves to the host's published localstack
      # port, the same address the browser uses.
      - "localstack.localhost:host-gateway"
    volumes:
      - ./backend/src:/app/backend/src
      - ./backend/prisma:/app/backend/prisma
      - ./backend/tsconfig.json:/app/backend/tsconfig.json
      - ./backend/nest-cli.json:/app/backend/nest-cli.json
    develop:
      watch:
        - action: sync
          path: ./backend/src
          target: /app/backend/src
          ignore:
            - node_modules/
        - action: sync
          path: ./backend/prisma
          target: /app/backend/prisma
        - action: rebuild
          path: ./backend/package.json
        - action: rebuild
          path: ./pnpm-lock.yaml
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      localstack:
        condition: service_healthy
      livekit:
        condition: service_healthy
      alana-recording-fixture:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:' + process.env.PORT + '/').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    ports:
      - "${VITE_PORT:-5173}:${VITE_PORT:-5173}"
    env_file:
      - path: ./frontend/.env
        required: false
    environment:
      - VITE_PORT=${VITE_PORT:-5173}
      - VITE_USE_POLLING=true
      - VITE_AUTH_MODE=test
      - VITE_TEST_AUTH_IDENTITY=${TEST_AUTH_IDENTITY:-operator-a}
      - VITE_API_BASE_URL=http://localhost:${BACKEND_PORT:-3000}
      # No hosted sign-in values reach a local bundle (gaulatti/alcantara#206);
      # TEST AUTH needs none of them.
      - VITE_COGNITO_USER_POOL_ID=
      - VITE_COGNITO_CLIENT_ID=
      - VITE_COGNITO_DOMAIN=
      - VITE_FQDN=
    volumes:
      - ./frontend/app:/app/app
      - ./frontend/vite.config.ts:/app/vite.config.ts
      - ./frontend/react-router.config.ts:/app/react-router.config.ts
      - ./frontend/tsconfig.json:/app/tsconfig.json
    develop:
      watch:
        - action: sync
          path: ./frontend/app
          target: /app/app
          ignore:
            - node_modules/
        - action: rebuild
          path: ./frontend/package.json
    command: sh -c "npm run dev"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres-data:
